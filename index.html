<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="icon" href="xlm.jpg" type="image/png">
</head>
<body class="index">

    <!-- 导航由 parts.js 把 nav.html 的内容填进这里，所以这里是空的 -->
    <header>
        <!--
        nav.html — 导航片段
        这个文件故意只有 <nav>，没有 DOCTYPE / html / head / body。
        它是一段「零件」，由 parts.js 取过来塞进每个页面的 #site-header 里。
        不要单独在浏览器里打开它 —— 它单看没有意义。
        --

        <a class="logo" href="index.html">
            <-- SVG 必须带 xmlns，否则在 HTML 里可能不渲染 --
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 3v18M3 12h18"></path>
            </svg>
            <span>My First Website</span>
        </a>

        <ul class="links">
            <li><a href="index.html">Home</a></li>
            <li><a href="quotes.html">Quotes</a></li>
            <li><a href="project.html">Project</a></li>
        </ul>

        <-- 药丸按钮：最右边。target="_blank" 让它在新标签页打开 --
        <a class="pill" href="contact.html" target="_blank" rel="noopener">Contact</a>
    </header>   -->

    <main class="index-wrap">
        <h1 class="index-title">Welcome to My First HTML Page</h1>

        <h2 class="index-label">Famous Quotes</h2>

        <!-- 注意：这里不要写 width 属性，尺寸由 styles.css 第一部分 1-4 的 .index-hero 控制 -->
        <a class="img-link" href="https://bilibili.com" target="_blank" rel="noopener">
            <img class="index-hero" src="bilibili.jpg" alt="fun image">
        </a>

        <p> <img class="index-inline" src="xlm.jpg" alt="fun image"></p>
        <p class="index-text">Here are some <a class="index-link" href="quotes.html">quotes</a></p>

        <p> <img class="index-inline" src="xlm.jpg" alt="fun image"></p>
        <p class="index-text">Here are some <a class="index-link" href="project.html">project</a></p>
    </main>

    <!-- 页脚由 parts.js 把 footer.html 的内容填进这里，所以这里是空的 -->
    <footer id="site-footer"></footer>

    <!-- 放在 </body> 前：此时 #site-header / #site-footer 都已经存在，脚本才找得到它们 -->
    <script src="parts.js"></script>
</body>
</html>
